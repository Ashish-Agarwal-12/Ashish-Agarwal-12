.p2{opacity:0;animation:vis2 16s linear infinite}
@keyframes vis2{0%{opacity:0}49.999%{opacity:0}50%{opacity:1}74.999%{opacity:1}75%{opacity:0}100%{opacity:0}}
.r2{transform-box:fill-box;transform-origin:0 0;animation:type2 16s infinite}
