@keyframes type3{0%{transform:scaleX(0)}75%{transform:scaleX(0);animation-timing-function:steps(30,end)}83%{transform:scaleX(1)}96%{transform:scaleX(1);animation-timing-function:steps(30,end)}100%{transform:scaleX(0)}100%{transform:scaleX(0)}}
