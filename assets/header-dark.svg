.c2{animation:cur2 16s infinite}
@keyframes cur2{0%{transform:translateX(0)}50%{transform:translateX(0);animation-timing-function:steps(25,end)}58%{transform:translateX(509.99999999999994px)}71%{transform:translateX(509.99999999999994px);animation-timing-function:steps(25,end)}75%{transform:translateX(0)}100%{transform:translateX(0)}}
.p3{opacity:0;animation:vis3 16s linear infinite}
