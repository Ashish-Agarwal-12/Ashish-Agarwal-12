<svg xmlns="http://www.w3.org/2000/svg" width="520" height="236" viewBox="0 0 520 236" role="img" aria-label="IRCTC Backend">
<title>IRCTC Backend — IRCTC-style train reservation backend: seat holds, payments, PNRs and RAC/WL promotion — built to never double-book.</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="0.6" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <clipPath id="r"><rect width="520" height="236" rx="16"/></clipPath>
</defs>
<style>
  .shine{animation:shine 6s ease-in-out infinite;animation-delay:0s}
  @keyframes shine{0%,70%{transform:translateX(-200px)}100%{transform:translateX(720px)}}
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#r)">
  <rect width="520" height="236" fill="#161b22"/>
  <rect width="520" height="236" fill="url(#g)"/>
  <rect width="6" height="236" fill="#a78bfa"/>
  <rect class="shine" x="0" y="-40" width="60" height="316" fill="#e6edf3" opacity="0.05" transform="rotate(18)"/>
</g>
