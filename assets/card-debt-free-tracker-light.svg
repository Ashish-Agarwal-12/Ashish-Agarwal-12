<svg xmlns="http://www.w3.org/2000/svg" width="520" height="236" viewBox="0 0 520 236" role="img" aria-label="Debt-Free Tracker">
<title>Debt-Free Tracker — Tracks daily spending and every EMI in one place, and warns you before you overspend. Password-protected, tested, auto-deployed.</title>
<defs>
